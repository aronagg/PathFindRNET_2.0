ambiguity_notes: Approach IDs are direction-specific and image-relative. A-D denote entry corridors; E-H
  denote exit corridors. Same-road entry/exit pairs are A/E, B/F, C/G, and D/H. Determine entry and exit
  from the full direction of travel, not solely from the first or last sampled point or polygon membership.
  B/F and C/G are spatially close under perspective; use temporal direction and source video frames when
  needed. If a trajectory starts or ends inside the intersection, is too short, or cannot be assigned
  to a unique approach, select UNKNOWN and mark it ambiguous. Mark it unusable when travel direction cannot
  be recovered. Treat adjacent lanes within the same corridor as one approach. U-turns are not included
  in the current mapping; flag a clear same-road reversal for protocol review instead of forcing it into
  left, right, or straight.
