ambiguity_notes: Approach IDs are direction-specific and image-relative. A-D denote entry corridors; E-H
  denote exit corridors. Same-road entry/exit pairs are A/E, B/F, C/G, and D/H. Determine entry and exit
  from the full direction of travel, not solely from the first or last sampled point, polygon membership,
  or a single lane-arrow marking. Strong fisheye perspective makes same-road entry and exit corridors
  appear spatially close, particularly B/F in the upper-center area, C/G on the left, and D/H near the
  lower-left image boundary. The lower-center E corridor and parts of the A/E movement paths are substantially
  occluded by the camera housing and nearby equipment. Strong sunlight, glare, and windshield reflections
  in the upper half of the image may temporarily obscure vehicles and lane boundaries. Use temporal direction
  and source video frames when a trajectory crosses an occluded or reflective area. Queued, lane-changing,
  or partially occluded vehicles must be classified from their complete observed movement rather than
  their position in a single frame. If a trajectory starts or ends inside the intersection, is too short,
  is truncated near an image boundary, or cannot be assigned to a unique approach, select UNKNOWN and
  mark it ambiguous. Mark it unusable when travel direction cannot be recovered. Treat adjacent lanes
  within the same corridor as one approach. U-turns are not included in the current mapping; flag a clear
  same-road reversal for protocol review instead of forcing it into left, right, or straight.
