ambiguity_notes: Approach IDs are direction-specific and image-relative. A-D denote entry corridors; E-H
  denote exit corridors. Same-road entry/exit pairs are A/E, B/F, C/G, and D/H. Determine entry and exit
  from the full direction of travel, not solely from the first or last sampled point or polygon membership.
  Same-road entry and exit corridors are spatially close under strong perspective and lens distortion,
  particularly B/F and C/G. The lower image area around A/E is partly affected by camera housing and edge
  cropping, while the upper-left area around C/G may be affected by glare. Use temporal direction and
  source video frames when needed. If a trajectory starts or ends inside the intersection, is too short,
  is truncated near the image boundary, or cannot be assigned to a unique approach, select UNKNOWN and
  mark it ambiguous. Mark it unusable when travel direction cannot be recovered. Treat adjacent lanes
  within the same corridor as one approach. U-turns are not included in the current mapping; flag a clear
  same-road reversal for protocol review instead of forcing it into left, right, or straight.
