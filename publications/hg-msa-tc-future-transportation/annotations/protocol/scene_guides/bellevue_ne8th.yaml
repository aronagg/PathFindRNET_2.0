ambiguity_notes: Approach IDs are direction-specific and image-relative. A-D denote entry corridors; E-H
  denote exit corridors. Same-road entry/exit pairs are A/E, B/F, C/G, and D/H. Determine entry and exit
  from the full direction of travel, not solely from the first or last sampled point, polygon membership,
  or a single lane-arrow marking. Strong perspective compresses the distant C/G corridors in the upper
  image area, while B/F and D/H are spatially close near the right and left image boundaries. The lower
  A/E corridors are partly truncated by the bottom image boundary. Dense urban traffic, queued vehicles,
  and temporary vehicle-to-vehicle occlusion may hide parts of a trajectory, particularly on the C/G and
  B/F approaches. Building and tree shadows create strong illumination changes across the intersection,
  and the overhead structure may obscure or visually compress distant movements. Use temporal direction
  and source video frames when a trajectory passes through an occluded, shadowed, or congested area. Queued,
  lane-changing, or partially observed vehicles must be classified from their complete observed movement
  rather than their position in a single frame. If a trajectory starts or ends inside the intersection,
  is too short, is truncated near an image boundary, or cannot be assigned to a unique approach, select
  UNKNOWN and mark it ambiguous. Mark it unusable when travel direction cannot be recovered. Treat adjacent
  lanes within the same corridor as one approach. U-turns are not included in the current mapping; flag
  a clear same-road reversal for protocol review instead of forcing it into left, right, or straight.
