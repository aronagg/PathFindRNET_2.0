ambiguity_notes: Approach IDs are direction-specific and image-relative. A-D denote entry corridors; E-H
  denote exit corridors. Same-road entry/exit pairs are A/E, B/F, C/G, and D/H. Determine entry and exit
  from the full direction of travel, not solely from the first or last sampled point or polygon membership.
  Same-road entry and exit corridors are spatially close under perspective, particularly B/F and C/G in
  the upper image area and D/H near the left image boundary. The lower foreground around A/E is substantially
  occluded by traffic-signal and camera-mounting structures. Use the full temporal direction and source
  video frames when a trajectory passes behind these structures or begins or ends near them. Queued or
  partially occluded vehicles must be classified from their observed movement rather than their position
  in a single frame. If a trajectory starts or ends inside the intersection, is too short, is truncated
  near an image boundary, or cannot be assigned to a unique approach, select UNKNOWN and mark it ambiguous.
  Mark it unusable when travel direction cannot be recovered. Treat adjacent lanes within the same corridor
  as one approach. U-turns are not included in the current mapping; flag a clear same-road reversal for
  protocol review instead of forcing it into left, right, or straight.
