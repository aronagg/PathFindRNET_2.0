  estimator: cv2.findHomography
  robust_method: RANSAC
  ransac_reprojection_threshold_px: 10.0
  max_iterations: 2000
  confidence: 0.995
  engineering_screening_passed_scenes: 5
  engineering_screening_scene_count: 5
  quality_class_interpretation: diagnostic engineering screening; not a prospective external-validation gate
  endpoint_extrapolation_percent_range: [90.4, 96.9]
  se38th_frozen_target: 18
  se38th_target_preserved_for_perturbation_px: [1, 2, 3, 5]
  se38th_primary_failure_mechanism: semantic endpoint-region granularity
  se38th_secondary_failure_mechanism: calibration fragility
  google_topview_redistribution_metadata_complete: false
modules:
  EMD:
    name: Endpoint Micro-Mode Discovery
    implementation: frozen split-aware-hg-msa-tc-v1
    split: target_estimation
    candidate_region_counts: [3, 4, 5, 6, 7, 8]
    support_threshold_grid: [0.001, 0.0025, 0.005, 0.01, 0.02]
    region_metric_sample_size: 2500
    coordinate_domain: homography_topview
    modifications_permitted: false
  SAC:
    name: Semantic Approach Consolidation
    split: target_estimation
    process_roles_separately: true
    cross_role_merge_permitted: false
    primary_heading_domain: camera_isotropic_shared_scale
    topview_heading_role: sensitivity_only
    heading_window_points: 5
    heading_definition:
      entry: directed vector from first to fifth finite canonical point
      exit: directed vector from fifth-last to last finite canonical point
      fewer_than_window_points: undefined
    centroid_definition: componentwise median of top-view endpoints in the micro-region
    bearing_definition: atan2 from frozen role-specific scene center to robust centroid
    circular_location: observed-angle circular L1 median; tie by lowest wrapped angle in [-pi,pi)
    circular_distance: absolute wrapped angular difference in [0,pi]
    dispersion_definition: circular median absolute deviation around circular location
    self_consistency:
      bootstrap_replicates: 500
      quantile: 0.95
      sampling_unit: trajectory within micro-region with replacement
      bearing_radius: q0.95 across bootstrap circular q0.95 residual radii
      heading_radius: q0.95 across bootstrap circular q0.95 residual radii
      pair_bearing_tolerance: sum of the two region bearing radii
      pair_heading_tolerance: sum of the two region heading radii
      numerical_floor: 8 times float64 machine epsilon radians
    pair_distance:
      primary: max(bearing_separation_over_pair_tolerance, heading_separation_over_pair_tolerance)
      compatible_when: distance <= 1
      manual_feature_weights: none
      mandatory_fields: [same_role, bearing, directed_heading]
      mandatory_od_profile_similarity: false
    consolidation:
      linkage: complete
      cluster_distance: maximum primary pair distance across cross-cluster pairs
      merge_rule: repeatedly merge the compatible cluster pair with minimum cluster distance
      tie_break: lexicographic sorted tuple of original micro-region IDs
      stop_rule: no cluster pair has complete-link distance <= 1
      output_order: role entry before exit, then circular bearing, then heading, then minimum original micro-region ID
    edge_cases:
      zero_support_region: retain as isolated supernode and report
      fewer_than_two_valid_bearings: retain as isolated supernode
      fewer_than_two_valid_headings: retain as isolated supernode in primary SAC
      one_region_for_role: return one supernode unchanged
      undefined_heading: no primary merge involving that region
      bootstrap_zero_radius: apply numerical floor; only numerically identical directions merge
      bootstrap_failure: fail the scene; no nearest-region fallback
      nonfinite_geometry: retain isolated with invalid_descriptor flag; do not impute
    od_profile:
      primary_merge_condition: false
      normalized_over: destination micro-regions for entry profiles and source micro-regions for exit profiles
      zero_support_profile: undefined; region isolated in SAC+OD diagnostic
      distance: Jensen-Shannon distance using base-2 logarithms and square root
      use: [SMG construction, A8 diagnostic]
  SMG:
    name: Semantic Maneuver Graph
    split: target_estimation
    nodes: SAC entry and exit supernodes
    aggregate_count: n_tilde_uv = sum_{i in u} sum_{j in v} n_ij
    denominator: number of target-estimation trajectories with valid entry and exit supernode assignments
    aggregate_share: q_tilde_uv = n_tilde_uv / N
    target: K_SMG = sum_{u,v} indicator(q_tilde_uv >= theta)
    threshold_comparison: greater_than_or_equal
    threshold_grid: [0.001, 0.0025, 0.005, 0.01, 0.02]
    threshold_selection:
      primary_eligibility: coverage >= 0.90 and K_SMG >= 2
      fallback_eligibility: coverage >= 0.80 and K_SMG >= 2
      final_fallback: all candidates
      order:
        - minimize adjacent-threshold target instability
        - minimize absolute distance to threshold 0.005
        - maximize supported trajectory coverage
        - minimize threshold
    missing_geometry: exclude from N and report count; do not infer an edge
    zero_valid_trajectories: fail the scene
    zero_supported_edges: permitted only in final fallback and reported as degenerate
  UATP:
    name: Uncertainty-Aware Target Prior
    split: target_estimation
    bootstrap_replicates: 500
    bootstrap_design: hierarchical recording-aware bootstrap
    bootstrap_steps:
      - sample the scene's source recordings with replacement, preserving recording count
      - for each selected recording occurrence sample its trajectories with replacement, preserving that recording's original trajectory count
      - run the complete frozen EMD -> primary SAC -> SMG pipeline
      - retain K_SMG for every replicate including degenerate flagged outcomes
    summaries: [mode, median, Shannon entropy in bits, percentile interval]
    mode_tie_break: smaller integer K_SMG
    primary_interval_level: 0.90
    primary_interval_quantiles: [0.05, 0.95]
    percentile_method: linear
    interval_integerization: [floor_lower_quantile, ceil_upper_quantile]
    sensitivity_interval_levels: [0.80, 0.90, 0.95]
    failed_replicate_policy: fail the scene if any failure is algorithmic; input-invalid replicates are retained as invalid and separately reported
  PCMS:
    name: Prior-Constrained Model Selection
    split: model_selection
    prior: frozen UATP primary 90 percent interval
    interval_distance:
      inside: 0
      below: L - K
      above: K - U
    candidate_count:
      kmeans: configured n_clusters from existing frozen candidate grid
      hdbscan: resulting non-noise cluster count
      optics: resulting non-noise cluster count
    selection_order:
      kmeans:
        - minimize interval distance
        - maximize silhouette_clustered_only
        - minimize davies_bouldin_clustered_only
        - maximize calinski_harabasz_clustered_only
        - minimize largest_cluster_ratio
        - deterministic lexical parameter order
      density_methods:
        - minimize interval distance
        - minimize pct_outliers
        - maximize silhouette_clustered_only
        - minimize davies_bouldin_clustered_only
        - maximize calinski_harabasz_clustered_only
        - minimize largest_cluster_ratio
        - deterministic lexical parameter order
    kmeans_forced_to_target: false
    emas_hg_role: diagnostic_only
