<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; overflow: hidden; }
    #toolbar { display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 2px 0 6px; }
    button {
      width: 32px; height: 30px; border: 1px solid #b8c0c8; border-radius: 4px;
      background: #fff; color: #17202a; font-size: 18px; cursor: pointer;
    }
    button:hover { background: #eef2f5; }
    button:disabled { cursor: default; opacity: 0.4; }
    input[type="range"] { width: 120px; }
    #scale-value { min-width: 38px; color: #3b4652; font-size: 12px; }
    #mode { margin-left: 4px; color: #3b4652; font-size: 13px; }
    #viewport { width: 100%; max-height: 650px; overflow: auto; border: 1px solid #c8d0d8; }
    canvas { display: block; width: 100%; height: auto; margin: 0 auto; cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="zoom-in" type="button" title="Zoom in">+</button>
    <button id="zoom-out" type="button" title="Zoom out">&minus;</button>
    <button id="fit" type="button" title="Fit image">&#8690;</button>
    <input id="scale" type="range" min="25" max="250" step="5" value="100" title="Image size">
    <span id="scale-value">100%</span>
    <button id="undo-point" class="polygon-only" type="button" title="Undo last polygon vertex">&#8630;</button>
    <button id="finish-polygon" class="polygon-only" type="button" title="Finish polygon">&#10003;</button>
    <span id="mode"></span>
  </div>
  <div id="viewport"><canvas id="canvas"></canvas></div>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const viewport = document.getElementById("viewport");
    const modeLabel = document.getElementById("mode");
    const scaleControl = document.getElementById("scale");
    const scaleValue = document.getElementById("scale-value");
    const undoPoint = document.getElementById("undo-point");
    const finishPolygon = document.getElementById("finish-polygon");
    const image = new Image();
    let args = {};
    let scale = 1;
    let dragStart = null;
    let dragCurrent = null;
    let transient = null;
    let polygonPoints = [];

    function send(type, payload = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
    }

    function setHeight() {
      const height = Math.min(viewport.scrollHeight, 650) + 42;
      send("streamlit:setFrameHeight", { height });
    }

    function roleColor(role) {
      if (role === "entry") return "#00a66a";
      if (role === "exit") return "#d1495b";
      return "#f2b134";
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height,
      };
    }

    function normalized(point) {
      return {
        x: Math.max(0, Math.min(1, point.x / canvas.width)),
        y: Math.max(0, Math.min(1, point.y / canvas.height)),
      };
    }

    function drawPoint(shape, active = false) {
      const x = shape.x * canvas.width;
      const y = shape.y * canvas.height;
      const color = roleColor(shape.region_role);
      ctx.beginPath();
      ctx.arc(x, y, active ? 10 : 8, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = active ? 0.95 : 0.8;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      drawLabel(shape.approach_id, x + 11, y - 11, color);
    }

    function drawRectangle(shape, active = false) {
      const x = shape.x_min * canvas.width;
      const y = shape.y_min * canvas.height;
      const width = (shape.x_max - shape.x_min) * canvas.width;
      const height = (shape.y_max - shape.y_min) * canvas.height;
      const color = roleColor(shape.region_role);
      ctx.globalAlpha = active ? 0.25 : 0.16;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 4 : 3;
      ctx.strokeRect(x, y, width, height);
      drawLabel(shape.approach_id, x + 6, y + 20, color);
    }

    function drawPolygon(shape, active = false) {
      const points = shape.points || [];
      if (!points.length) return;
      const color = roleColor(shape.region_role);
      ctx.beginPath();
      ctx.moveTo(points[0].x * canvas.width, points[0].y * canvas.height);
      for (const point of points.slice(1)) {
        ctx.lineTo(point.x * canvas.width, point.y * canvas.height);
      }
      if (points.length >= 3) {
        ctx.closePath();
        ctx.globalAlpha = active ? 0.25 : 0.16;
        ctx.fillStyle = color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 4 : 3;
      ctx.stroke();
      for (const point of points) {
        ctx.beginPath();
        ctx.arc(point.x * canvas.width, point.y * canvas.height, active ? 7 : 5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      drawLabel(
        shape.approach_id,
        points[0].x * canvas.width + 9,
        points[0].y * canvas.height - 9,
        color,
      );
    }

    function drawLabel(text, x, y, color) {
      if (!text) return;
      ctx.font = "bold 16px Arial";
      const width = ctx.measureText(text).width + 10;
      ctx.fillStyle = "rgba(17, 17, 17, 0.86)";
      ctx.fillRect(x - 4, y - 17, width, 23);
      ctx.fillStyle = color;
      ctx.fillText(text, x + 1, y);
    }

    function draw() {
      if (!image.complete || !canvas.width) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      for (const shape of args.existing_shapes || []) {
        if (shape.type === "polygon") drawPolygon(shape);
        else if (shape.type === "rectangle") drawRectangle(shape);
        else drawPoint(shape);
      }
      if (transient) {
        if (transient.type === "polygon") drawPolygon(transient, true);
        else if (transient.type === "rectangle") drawRectangle(transient, true);
        else drawPoint(transient, true);
      }
      canvas.style.width = `${scale * 100}%`;
      scaleControl.value = String(Math.round(scale * 100));
      scaleValue.textContent = `${Math.round(scale * 100)}%`;
      undoPoint.disabled = polygonPoints.length === 0;
      finishPolygon.disabled = polygonPoints.length < 3;
      setHeight();
    }

    function emit(shape) {
      transient = shape;
      draw();
      send("streamlit:setComponentValue", {
        value: { ...shape, nonce: `${Date.now()}-${Math.random()}` },
      });
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      canvas.setPointerCapture(event.pointerId);
      dragStart = canvasPoint(event);
      dragCurrent = dragStart;
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragStart || args.mode !== "rectangle") return;
      dragCurrent = canvasPoint(event);
      const a = normalized(dragStart);
      const b = normalized(dragCurrent);
      transient = {
        type: "rectangle",
        approach_id: args.approach_id || "",
        region_role: args.region_role || "both",
        x_min: Math.min(a.x, b.x), y_min: Math.min(a.y, b.y),
        x_max: Math.max(a.x, b.x), y_max: Math.max(a.y, b.y),
      };
      draw();
    });

    canvas.addEventListener("pointerup", event => {
      if (!dragStart) return;
      const end = canvasPoint(event);
      if (args.mode === "polygon") {
        polygonPoints.push(normalized(end));
        transient = {
          type: "polygon",
          approach_id: args.approach_id || "",
          region_role: args.region_role || "both",
          points: polygonPoints,
        };
        draw();
      } else if (args.mode === "rectangle") {
        const a = normalized(dragStart);
        const b = normalized(end);
        if (Math.abs(end.x - dragStart.x) >= 4 && Math.abs(end.y - dragStart.y) >= 4) {
          emit({
            type: "rectangle",
            approach_id: args.approach_id || "",
            region_role: args.region_role || "both",
            x_min: Math.min(a.x, b.x), y_min: Math.min(a.y, b.y),
            x_max: Math.max(a.x, b.x), y_max: Math.max(a.y, b.y),
          });
        }
      } else {
        const point = normalized(end);
        emit({
          type: "point",
          approach_id: args.approach_id || "",
          region_role: args.region_role || "both",
          x: point.x, y: point.y,
        });
      }
      dragStart = null;
      dragCurrent = null;
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      scale = Math.min(2.5, scale * 1.25);
      draw();
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      scale = Math.max(0.25, scale / 1.25);
      draw();
    });
    function fitImage() {
      const availableWidth = Math.max(viewport.clientWidth, 1);
      const heightAtFullWidth = canvas.height * availableWidth / canvas.width;
      scale = Math.max(0.25, Math.min(1, 620 / heightAtFullWidth));
      viewport.scrollTo(0, 0);
      draw();
    }
    document.getElementById("fit").addEventListener("click", fitImage);
    scaleControl.addEventListener("input", () => {
      scale = Number(scaleControl.value) / 100;
      draw();
    });
    undoPoint.addEventListener("click", () => {
      polygonPoints.pop();
      transient = polygonPoints.length ? {
        type: "polygon",
        approach_id: args.approach_id || "",
        region_role: args.region_role || "both",
        points: polygonPoints,
      } : null;
      draw();
    });
    finishPolygon.addEventListener("click", () => {
      if (polygonPoints.length < 3) return;
      const completed = {
        type: "polygon",
        approach_id: args.approach_id || "",
        region_role: args.region_role || "both",
        points: polygonPoints.map(point => ({ ...point })),
      };
      polygonPoints = [];
      emit(completed);
    });

    window.addEventListener("message", event => {
      if (event.data.type !== "streamlit:render") return;
      const previousSource = args.image_data_url;
      const previousMode = args.mode;
      const previousApproach = args.approach_id;
      args = event.data.args || {};
      if (previousMode !== args.mode || previousApproach !== args.approach_id) {
        polygonPoints = [];
        transient = null;
      }
      const polygonMode = args.mode === "polygon";
      modeLabel.textContent = polygonMode ? "Polygon region" : "Point marker";
      for (const element of document.querySelectorAll(".polygon-only")) {
        element.style.display = polygonMode ? "inline-block" : "none";
      }
      if (args.image_data_url && args.image_data_url !== previousSource) {
        image.src = args.image_data_url;
      } else {
        draw();
      }
    });

    image.addEventListener("load", () => {
      const maximumWidth = 1600;
      const factor = Math.min(1, maximumWidth / image.naturalWidth);
      canvas.width = Math.max(1, Math.round(image.naturalWidth * factor));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * factor));
      transient = null;
      polygonPoints = [];
      fitImage();
    });
    window.addEventListener("resize", setHeight);
    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 420 });
  </script>
</body>
</html>
